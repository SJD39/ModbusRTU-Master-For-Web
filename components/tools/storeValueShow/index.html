<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>存储值显示</title>
    <link rel="stylesheet" href="css.css">
</head>

<body>
    <div class="meanArea">
        <p>意义值：<input type="text" id="meanValue_dom"></p>
        <p>值类型：
            <select id="valueType_dom">
                <option value="int16">int16</option>
                <option value="uint16">uint16</option>
                <option value="int32">int32</option>
                <option value="uint32">uint32</option>
                <option value="float">float</option>
            </select>
        </p>
        <p>字节序：
            <select id="endian_dom">
                <option value="little">小端序</option>
                <option value="big">大端序</option>
            </select>
        </p>
        <p>字节交换：
            <select id="byteSwap_dom">
                <option value="none">不交换</option>
                <option value="swap">交换</option>
            </select>
        </p>
        <p>字节序示例：0x12 0x34 0x56 0x78 ->
            <span id="storeValueExample_dom"></span>
        </p>
        <div>
            <button onclick="cacheStoreValue(0)">缓存1</button>
            <button onclick="cacheStoreValue(1)">缓存2</button>
        </div>
    </div>
    <div class="storeArea storeArea_sync">
        <ul>
            <li>二进制：<input type="text" id="storeShowBin_sync_dom"></input></li>
            <li>十进制：<input type="text" id="storeShowDec_sync_dom"></input></li>
            <li>十六进制：<input type="text" id="storeShowHex_sync_dom"></input></li>
        </ul>
        <p class="areaTag">sync</p>
    </div>
    <div class="storeArea">
        <ul>
            <li>二进制：<span id="storeShowBin_cache1_dom"></span></li>
            <li>十进制：<span id="storeShowDec_cache1_dom"></span></li>
            <li>十六进制：<span id="storeShowHex_cache1_dom"></span></li>
        </ul>
        <p class="areaTag">cache1</p>
    </div>
    <div class="storeArea">
        <ul>
            <li>二进制：<span id="storeShowBin_cache2_dom"></span></li>
            <li>十进制：<span id="storeShowDec_cache2_dom"></span></li>
            <li>十六进制：<span id="storeShowHex_cache2_dom"></span></li>
        </ul>
        <p class="areaTag">cache2</p>
    </div>
</body>

<script src="./Extend.js"></script>
<script src="./View.js"></script>
<script src="./calculateStoreValue.js"></script>
<script src="./calculateMeanValue.js"></script>
<script src="./example.js"></script>

</html>
