<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModBusRTUMasterTest</title>

    <script src="../extend/BitConvert.js"></script>
    <script src="./ModBusRTUMaster.js"></script>
</head>

<body>
    <!-- 配置串口信息 -->
    <h1>串口配置：</h1>
    <button id="sel_port_btn">选择串口</button>

    <span>波特率：</span>
    <select id="baud_rate_select">
        <option value="9600">9600</option>
        <option value="19200">19200</option>
        <option value="115200">115200</option>
    </select>

    <span>数据位：</span>
    <select id="data_bits_select">
        <option value="8">8</option>
        <option value="7">7</option>
    </select>

    <span>停止位：</span>
    <select id="stop_bits_select">
        <option value="1">1</option>
        <option value="2">2</option>
    </select>

    <span>奇偶校验：</span>
    <select id="parity_select">
        <option value="none">无</option>
        <option value="even">偶校验</option>
        <option value="odd">奇校验</option>
    </select>

    <button id="open_port_btn">打开串口</button>

    <script>
        var serialPort = null;
        var modBusRTUMaster = new ModBusRTUMaster();

        // 选择串口
        sel_port_btn.addEventListener("click", async () => {
            try {
                serialPort = await navigator.serial.requestPort();
            } catch (e) {
                return;
            }
        });

        // 打开串口
        open_port_btn.addEventListener("click", async () => {
            let port_options = {
                baudRate: Number(baud_rate_select.value),
                dataBits: Number(data_bits_select.value),
                stopBits: Number(stop_bits_select.value),
                parity: parity_select.value,
                bufferSize: 1024,
            };
            await serialPort.open(port_options);

            modBusRTUMaster.startMaster(serialPort);
        });

        // 监听读取
        modBusRTUMaster.onReadCallback = (timestamp, data) => {
            console.log("读：" + timestamp, data);
        };

        // 监听写入
        modBusRTUMaster.onWriteCallback = (timestamp, data) => {
            console.log("写：" + timestamp, data);
        };
    </script>

    <!-- 功能测试 -->
    <h1>功能测试：</h1>
    <h2>读线圈</h2>
    <input type="number" id="read_coil_slave_id" placeholder="请输入从站ID" />
    <input type="number" id="read_coil_addr" placeholder="请输入起始地址" />
    <input type="number" id="read_coil_num" placeholder="请输入读取数量" />
    <button id="read_coil_btn">读线圈</button>
    <span id="read_coil_result"></span>
    <script>
        read_coil_btn.addEventListener("click", async () => {
            let data = await modBusRTUMaster.readCoils(read_coil_slave_id.value, read_coil_addr.value, read_coil_num.value);
            read_coil_result.innerHTML = data;
            console.log(data);
        });
    </script>

    <h2>读离散</h2>
    <input type="number" id="read_discrete_slave_id" placeholder="请输入从站ID" />
    <input type="number" id="read_discrete_addr" placeholder="请输入起始地址" />
    <input type="number" id="read_discrete_num" placeholder="请输入读取数量" />
    <button id="read_discrete_btn">读离散</button>
    <span id="read_discrete_result"></span>
    <script>
        read_discrete_btn.addEventListener("click", async () => {
            let data = await modBusRTUMaster.readDiscrete(read_discrete_slave_id.value, read_discrete_addr.value, read_discrete_num.value);
            read_discrete_result.innerHTML = data;
            console.log(data);
        });
    </script>

    <h2>读保持寄存器</h2>
    <input type="number" id="read_holding_slave_id" placeholder="请输入从站ID" />
    <input type="number" id="read_holding_addr" placeholder="请输入起始地址" />
    <input type="number" id="read_holding_num" placeholder="请输入读取数量" />
    <button id="read_holding_btn">读保持寄存器</button>
    <span id="read_holding_result"></span>
    <script>
        read_holding_btn.addEventListener("click", async () => {
            let data = await modBusRTUMaster.readHoldingRegisters(read_holding_slave_id.value, read_holding_addr.value, read_holding_num.value);
            read_holding_result.innerHTML = data;
            console.log(data);
        });
    </script>

    <h2>读输入寄存器</h2>
    <input type="number" id="read_input_slave_id" placeholder="请输入从站ID" />
    <input type="number" id="read_input_addr" placeholder="请输入起始地址" />
    <input type="number" id="read_input_num" placeholder="请输入读取数量" />
    <button id="read_input_btn">读输入寄存器</button>
    <span id="read_input_result"></span>
    <script>
        read_input_btn.addEventListener("click", async () => {
            let data = await modBusRTUMaster.readInputRegisters(read_input_slave_id.value, read_input_addr.value, read_input_num.value);
            read_input_result.innerHTML = data;
            console.log(data);
        });
    </script>

    <h2>写单个线圈</h2>
    <input type="number" id="write_single_coil_slave_id" placeholder="请输入从站ID" />
    <input type="number" id="write_single_coil_addr" placeholder="请输入线圈地址" />
    <select id="write_single_coil_value">
        <option value="true">ON</option>
        <option value="false">OFF</option>
    </select>
    <button id="write_single_coil_btn">写单个线圈</button>
    <span id="write_single_coil_result"></span>
    <script>
        write_single_coil_btn.addEventListener("click", async () => {
            let data = await modBusRTUMaster.writeSingleCoil(write_single_coil_slave_id.value, write_single_coil_addr.value, write_single_coil_value.value === "true");
            write_single_coil_result.innerHTML = data;
            console.log(data);
        });
    </script>

    <h2>写单个保持寄存器</h2>
    <input type="number" id="write_single_reg_slave_id" placeholder="请输入从站ID" />
    <input type="number" id="write_single_reg_addr" placeholder="请输入寄存器地址" />
    <input type="number" id="write_single_reg_value" placeholder="请输入值" />
    <button id="write_single_reg_btn">写单个保持寄存器</button>
    <span id="write_single_reg_result"></span>
    <script>
        write_single_reg_btn.addEventListener("click", async () => {
            let data = await modBusRTUMaster.writeSingleRegister(write_single_reg_slave_id.value, write_single_reg_addr.value, write_single_reg_value.value);
            write_single_reg_result.innerHTML = data;
            console.log(data);
        });
    </script>

    <h2>写多个线圈</h2>
    <input type="number" id="write_multi_coil_slave_id" placeholder="请输入从站ID" />
    <input type="number" id="write_multi_coil_addr" placeholder="请输入起始地址" />
    <input type="number" id="write_multi_coil_num" placeholder="请输入线圈数量" />
    <input type="text" id="write_multi_coil_values" placeholder="请输入值(逗号分隔,如:1,0,1,0)" />
    <button id="write_multi_coil_btn">写多个线圈</button>
    <span id="write_multi_coil_result"></span>
    <script>
        write_multi_coil_btn.addEventListener("click", async () => {
            let values = write_multi_coil_values.value.split(",").map(v => v.trim() === "1" || v.trim().toLowerCase() === "true");
            let data = await modBusRTUMaster.writeMultipleCoils(write_multi_coil_slave_id.value, write_multi_coil_addr.value, write_multi_coil_num.value, values);
            write_multi_coil_result.innerHTML = data;
            console.log(data);
        });
    </script>

    <h2>写多个寄存器</h2>
    <input type="number" id="write_multi_reg_slave_id" placeholder="请输入从站ID" />
    <input type="number" id="write_multi_reg_addr" placeholder="请输入起始地址" />
    <input type="number" id="write_multi_reg_num" placeholder="请输入寄存器数量" />
    <input type="text" id="write_multi_reg_values" placeholder="请输入值(逗号分隔,如:100,200,300)" />
    <button id="write_multi_reg_btn">写多个寄存器</button>
    <span id="write_multi_reg_result"></span>
    <script>
        write_multi_reg_btn.addEventListener("click", async () => {
            let values = write_multi_reg_values.value.split(",").map(v => parseInt(v.trim()));
            let data = await modBusRTUMaster.writeMultipleRegisters(write_multi_reg_slave_id.value, write_multi_reg_addr.value, write_multi_reg_num.value, values);
            write_multi_reg_result.innerHTML = data;
            console.log(data);
        });
    </script>
</body>


</html>
